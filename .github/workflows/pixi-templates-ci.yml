name: Validate Pixi templates

on:
  push:
    branches:
      - main
    paths:
      - "python-pixi/**"
      - "python-pixi-sapelo2/**"
      - "r-pixi/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pixi-templates-ci.yml"
      - ".github/workflows/pixi-monthly-update.yml"
  pull_request:
    paths:
      - "python-pixi/**"
      - "python-pixi-sapelo2/**"
      - "r-pixi/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pixi-templates-ci.yml"
      - ".github/workflows/pixi-monthly-update.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Cache-only x86_64-linux verification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Offline updater tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check template evaluation and cache-only execution
        run: python3 scripts/verify_pixi_templates.py
